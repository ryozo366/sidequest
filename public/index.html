<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidequest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Cpath d='M35.5 12 20 36h10l-2.5 16L44 27H34l1.5-15z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <span id="navbar-title" class="navbar-title">Sidequest</span>
      <button id="open-post-modal" class="post-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Post
      </button>
    </div>
  </nav>

  <div class="app">

    <header class="masthead">
      <p id="date-eyebrow" class="eyebrow"></p>
      <h1>Sidequest</h1>
      <p class="lede">Small paid tasks, close to home.</p>
      <div class="location-line">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="location-display"></span>
        <button id="use-my-location" class="text-btn">Use my location</button>
        <span class="dot-sep" aria-hidden="true">·</span>
        <button id="edit-location" class="text-btn">Edit</button>
      </div>
      <div id="location-editor" class="location-editor hidden">
        <input id="loc-lat" type="number" step="any" min="-90" max="90" placeholder="Latitude" inputmode="decimal" />
        <input id="loc-lng" type="number" step="any" min="-180" max="180" placeholder="Longitude" inputmode="decimal" />
        <input id="loc-name" type="text" maxlength="60" placeholder="Label" />
        <button id="save-location" class="text-btn text-btn-bold">Save</button>
      </div>
    </header>

    <div class="chip-rail" id="radius-chips" role="radiogroup" aria-label="Search radius">
      <button class="chip" data-radius="1">1 km</button>
      <button class="chip" data-radius="5">5 km</button>
      <button class="chip chip-active" data-radius="10">10 km</button>
      <button class="chip" data-radius="25">25 km</button>
      <button class="chip" data-radius="50">50 km</button>
      <button class="chip" data-radius="all">Any distance</button>
    </div>

    <div class="filter-row">
      <div class="select-wrap">
        <select id="category-filter" aria-label="Category">
          <option value="all">All categories</option>
          <option>Garden</option>
          <option>Pets</option>
          <option>Moving</option>
          <option>Errands</option>
          <option>Repairs</option>
          <option>Tech</option>
          <option>Other</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="sort-select" aria-label="Sort by">
          <option value="distance">Nearest first</option>
          <option value="pay">Best pay</option>
          <option value="newest">Newest</option>
        </select>
      </div>
      <label class="switch-row">
        <span class="switch-label">Taken</span>
        <span class="switch">
          <input type="checkbox" id="show-accepted" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </div>

    <main>
      <section id="hero-slot" aria-label="Featured quest"></section>

      <div class="list-head">
        <h2 id="list-title">All quests</h2>
        <p id="result-summary" class="result-summary" role="status"></p>
      </div>

      <section id="quest-list" class="quest-list" aria-live="polite"></section>

      <div id="empty-state" class="empty-state hidden">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <p class="empty-title">No sidequests in range</p>
        <p class="empty-hint">Try a wider radius, or post the first quest in your area.</p>
      </div>
    </main>
  </div>

  <dialog id="post-modal" class="sheet">
    <form id="post-form" method="dialog">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-header">
        <button type="button" id="cancel-post" class="text-btn">Cancel</button>
        <span class="sheet-title">New Sidequest</span>
        <button type="submit" class="text-btn text-btn-bold">Post</button>
      </div>

      <div class="sheet-body">
        <div class="field-group">
          <input name="title" type="text" maxlength="120" required placeholder="What needs doing?" />
          <textarea name="description" maxlength="2000" rows="3" required
            placeholder="Details — tools provided, anything to bring…"></textarea>
        </div>

        <div class="field-group">
          <div class="field-split">
            <label class="field">
              <span>Reward (€)</span>
              <input name="pay" type="number" min="0" max="100000" step="0.5" required placeholder="60" inputmode="decimal" />
            </label>
            <label class="field">
              <span>Time needed</span>
              <input name="duration" type="text" maxlength="60" required placeholder="~3 hours" />
            </label>
          </div>
          <div class="field-split">
            <label class="field">
              <span>Category</span>
              <div class="select-wrap select-wrap-fill">
                <select name="category">
                  <option>Garden</option>
                  <option>Pets</option>
                  <option>Moving</option>
                  <option>Errands</option>
                  <option>Repairs</option>
                  <option>Tech</option>
                  <option selected>Other</option>
                </select>
              </div>
            </label>
            <label class="field">
              <span>Complete by</span>
              <input name="completeBy" type="date" />
            </label>
          </div>
        </div>

        <div class="field-group">
          <label class="field">
            <span>Place shown on the card</span>
            <input name="locationName" type="text" maxlength="120" required placeholder="e.g. Prenzlauer Berg, Berlin" />
          </label>
          <div class="field-split coords-split">
            <label class="field">
              <span>Latitude</span>
              <input name="lat" type="number" step="any" min="-90" max="90" required inputmode="decimal" />
            </label>
            <label class="field">
              <span>Longitude</span>
              <input name="lng" type="number" step="any" min="-180" max="180" required inputmode="decimal" />
            </label>
          </div>
          <button type="button" id="fill-my-coords" class="text-btn coords-btn">Use my location</button>
        </div>

        <div class="field-group">
          <label class="field">
            <span>Your name</span>
            <input name="postedBy" type="text" maxlength="60" required placeholder="Shown to helpers" />
          </label>
        </div>

        <p id="form-error" class="form-error hidden"></p>
      </div>
    </form>
  </dialog>

  <template id="hero-template">
    <article class="hero-card quest-card">
      <div class="hero-top">
        <p class="hero-eyebrow"></p>
        <span class="hero-distance distance-badge"></span>
      </div>
      <h3 class="hero-title"></h3>
      <p class="hero-desc"></p>
      <div class="hero-bottom">
        <div class="hero-meta">
          <span class="hero-location"></span>
          <span class="hero-byline"></span>
        </div>
        <button class="hero-accept"></button>
      </div>
    </article>
  </template>

  <template id="quest-card-template">
    <article class="quest-card cell">
      <span class="cat-tile" aria-hidden="true"></span>
      <div class="cell-main">
        <h3 class="quest-title"></h3>
        <p class="quest-meta"><span class="quest-category"></span><span class="dot" aria-hidden="true">·</span><span class="distance-badge"></span><span class="dot" aria-hidden="true">·</span><span class="quest-duration"></span><span class="dot deadline-dot" aria-hidden="true">·</span><span class="quest-deadline"></span></p>
        <p class="quest-desc"></p>
        <p class="quest-byline"></p>
      </div>
      <div class="cell-action">
        <button class="btn-accept"></button>
        <span class="action-caption"></span>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
